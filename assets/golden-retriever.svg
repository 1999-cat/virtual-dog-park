<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="goldenTitle">
  <title id="goldenTitle">Illustration of a Golden Retriever</title>
  <!-- tail -->
  <path d="M150 140 q34 0 34 -38" fill="none" stroke="#e3b15f" stroke-width="15" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="100" cy="140" rx="56" ry="46" fill="#e9bd6e"/>
  <!-- lighter chest -->
  <ellipse cx="100" cy="150" rx="30" ry="30" fill="#f6e3bf"/>
  <!-- legs -->
  <rect x="76" y="170" width="16" height="22" rx="7" fill="#e9bd6e"/>
  <rect x="108" y="170" width="16" height="22" rx="7" fill="#e9bd6e"/>
  <!-- floppy ears -->
  <path d="M54 82 q-16 28 2 56 q12 -10 14 -36 z" fill="#d9a94f"/>
  <path d="M146 82 q16 28 -2 56 q-12 -10 -14 -36 z" fill="#d9a94f"/>
  <!-- head -->
  <circle cx="100" cy="92" r="47" fill="#e9bd6e"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="116" rx="28" ry="22" fill="#f6e3bf"/>
  <!-- eyes -->
  <circle cx="84" cy="90" r="6.5" fill="#2b2b2b"/>
  <circle cx="116" cy="90" r="6.5" fill="#2b2b2b"/>
  <!-- nose -->
  <ellipse cx="100" cy="108" rx="10" ry="8" fill="#2b2b2b"/>
  <!-- mouth -->
  <path d="M100 116 v8 M100 124 q-12 7 -20 1 M100 124 q12 7 20 1" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
</svg>

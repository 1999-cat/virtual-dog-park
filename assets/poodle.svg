<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="poodleTitle">
  <title id="poodleTitle">Illustration of a Poodle</title>
  <!-- fluffy tail -->
  <circle cx="178" cy="120" r="10" fill="#f0c089"/>
  <!-- fluffy body made of soft curls -->
  <g fill="#f0c089">
    <circle cx="100" cy="140" r="40"/>
    <circle cx="68" cy="135" r="26"/>
    <circle cx="132" cy="135" r="26"/>
    <circle cx="84" cy="165" r="22"/>
    <circle cx="118" cy="165" r="22"/>
    <circle cx="100" cy="175" r="20"/>
  </g>
  <!-- slim legs -->
  <rect x="80" y="172" width="11" height="22" rx="5" fill="#e0ac74"/>
  <rect x="109" y="172" width="11" height="22" rx="5" fill="#e0ac74"/>
  <!-- long fluffy ears -->
  <path d="M60 78 q-14 30 6 58 q12 -12 12 -40 z" fill="#e7b27c"/>
  <path d="M140 78 q14 30 -6 58 q-12 -12 -12 -40 z" fill="#e7b27c"/>
  <!-- head -->
  <circle cx="100" cy="86" r="42" fill="#f0c089"/>
  <!-- topknot pom -->
  <circle cx="100" cy="48" r="20" fill="#f0c089"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="104" rx="22" ry="18" fill="#f8ddbe"/>
  <!-- eyes -->
  <circle cx="86" cy="86" r="6" fill="#2b2b2b"/>
  <circle cx="114" cy="86" r="6" fill="#2b2b2b"/>
  <!-- nose -->
  <ellipse cx="100" cy="100" rx="9" ry="7" fill="#2b2b2b"/>
  <!-- mouth -->
  <path d="M100 107 v7 M100 114 q-10 6 -17 1 M100 114 q10 6 17 1" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
</svg>
